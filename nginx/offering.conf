# **M137g (testFlow `D441`/`D485`/`D447`) — the listener that OFFERS a broken suite and negotiates a
# modern one.** Included into `nginx.conf`'s `http {}` block by `docker-entrypoint.sh`, and **only
# when `VULN_MODE=1`**: this is a plant, and a plant that is present by default is one the ~45 other
# suites in this repo would be running against without anybody deciding they should.
#
# ## What it is for
#
# It is the first host in this corpus on which `sec/tls-weak-cipher` can fire, and the reason it
# needed building is the false negative that rule shipped with in `M128c`. The rule judged the suite
# tflw's own client was *given* — so a server that still carries `NULL-SHA256` in its configuration
# hands a current client AES-GCM, reads clean, and keeps the broken suite reachable by anybody who
# asks for it. `VULNS.md` has recorded that pair as *"positive unverified by construction"* ever
# since. This closes half of it.
#
# ## Measured on this exact image, 2026-08-18 (nginx:1.27-alpine, OpenSSL 3.x)
#
#   an ordinary client                            -> TLSv1.3, TLS_AES_256_GCM_SHA384  (impeccable)
#   a client naming NULL-SHA256 with @SECLEVEL=0  -> TLSv1.2, NULL-SHA256   (no encryption at all)
#   a client naming NULL-SHA                      -> handshake_failure      (offered: no)
#   a client naming RC4-SHA                       -> its own OpenSSL refuses to ask
#
# All four states matter, and the last two are not noise: they are the `refused` and `unaskable`
# halves of tflw's three-list result, and a corpus that produced only the first two would leave the
# distinction between *"this host said no"* and *"we could not ask"* untested on live traffic.
#
# ## Why the switches are what they are
#
# `@SECLEVEL=0` is required on the SERVER half too — OpenSSL 3.2 will not put an eNULL suite in a
# listener at security level 1 or above. It lowers this listener's certificate acceptance as well,
# which is harmless here (the sidecar's cert is a throwaway RSA-2048 either way) and is exactly why
# the same switch on the *client* half is fenced to a single bit in tflw (testFlow `D486`).
#
# TLS 1.3 is deliberately left enabled. Pinning to 1.2 would also work, but a host that cannot speak
# 1.3 is one an ordinary scanner might already treat as dated — and the point being demonstrated is a
# host that looks *current* by every visible measure and is not.
#
# RC4 and 3DES are absent rather than withheld: OpenSSL 3.2 will not construct a listener for them at
# all (`ERR_SSL_NO_CIPHER_MATCH`), which is why `NULL-SHA256` is the one broken suite in this repo and
# why `VULNS.md` records those two as permanently unconstructible on this platform.
#
# ## Why its own port and not a change to 8443
#
# The same blast-radius rule every plant in `VULNS.md` follows. 8443 is the pentest arc's
# clean-transport control, and two ledger rows in `scripts/verify-security-acceptance.mjs` assert by
# name that `sec/tls-weak-cipher` stays SILENT there. Moving the plant onto 8443 would not have made
# those rows fail loudly — it would have made them fail, which is worse only in that somebody would
# then have "fixed" the assertion.

server {
  listen 8445 ssl;
  server_name _;

  ssl_certificate     /certs/server.pem;
  ssl_certificate_key /certs/server.key;

  ssl_protocols TLSv1.2 TLSv1.3;
  # Modern first, and `ssl_prefer_server_ciphers` left off on purpose: the client's own preference
  # decides, so an ordinary caller never sees the second entry and a caller that names it gets it.
  ssl_ciphers 'ECDHE-RSA-AES128-GCM-SHA256:NULL-SHA256:@SECLEVEL=0';

  location / {
    proxy_pass http://api:4001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
