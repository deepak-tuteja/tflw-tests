worker_processes 1;
events {
  worker_connections 1024;
}

http {
  # Self-signed HTTPS, no client cert required — dogfoods tflw's `insecure true` /
  # NODE_EXTRA_CA_CERTS / `--forbid-insecure` (M22, cluster 1+2).
  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /certs/server.pem;
    ssl_certificate_key /certs/server.key;

    location / {
      proxy_pass http://api:4001;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      # testFlow M128a: this sidecar terminates TLS and proxies to a plaintext upstream, so the
      # app's own socket is never TLS and `req.secure` is always false behind it. This header is
      # the only surviving evidence of the client's scheme, and apiV2 needs it to decide whether
      # the session cookie gets `Secure` (apiV2/src/common/request-scheme.ts).
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Same self-signed server cert, but also requires a client certificate signed by the same
  # throwaway CA — dogfoods tflw's mTLS `cert`/`key` config (M22, cluster 1).
  server {
    listen 8444 ssl;
    server_name _;

    ssl_certificate        /certs/server.pem;
    ssl_certificate_key    /certs/server.key;
    ssl_client_certificate /certs/ca.pem;
    ssl_verify_client      on;

    location / {
      proxy_pass http://api:4001;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Client-DN $ssl_client_s_dn;
    }
  }

  # **M137g's offering listener is included from here, and only when `VULN_MODE=1`.**
  # `nginx/offering.conf` holds a third listener (8445) that deliberately offers a broken cipher
  # suite. It is a plant, so it obeys the same rule every plant in `apiV2/src/vuln/` obeys (D293):
  # absent from the stack unless somebody asked for it. `docker-entrypoint.sh` copies the file into
  # this directory under the flag and removes it otherwise, so without the flag this glob matches
  # nothing and 8445 refuses connections — which is the observable difference `verify-vuln-slice-
  # hidden.mjs` checks for the app half.
  include /etc/nginx/offering/*.conf;
}
