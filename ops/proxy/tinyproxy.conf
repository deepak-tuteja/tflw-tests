# `S-3d`: the proxy tenant's whole configuration. It is not an open proxy, three times over: compose
# publishes its port on 127.0.0.1 only; `Allow` admits loopback and the private ranges Docker's
# networks are drawn from (the host's connection arrives from the compose network's gateway); and
# the filter lets it forward to the stack's own api and nothing else.
Port 8888
Listen 0.0.0.0
Timeout 30
MaxClients 20
LogLevel Info

Allow 127.0.0.1
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# Written on a proxied `GET` only; Node tunnels (below), so the api sees no `Via` from tflw.
ViaProxyName "tflw-proxy"

Filter "/etc/tinyproxy/filter"
FilterDefaultDeny Yes
FilterExtended Yes
FilterURLs No

# Node's proxy agent (undici's `EnvHttpProxyAgent`, which `NODE_USE_ENV_PROXY` turns on) tunnels
# plain-HTTP requests too — it sends `CONNECT api:4001`, never a proxied `GET`. So a tunnel is
# allowed, to the api's own container port only; the filter above still names the one host.
ConnectPort 4001
