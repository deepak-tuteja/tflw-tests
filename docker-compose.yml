services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-testflow_tests}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 20
    # No named/host volume — an ephemeral per-run DB is the isolation model
    # (plan_v2.md Part A); `node cli.mjs stop` runs `down -v` so every
    # `start` begins from a clean database.

  # PLAN_ENTERPRISE_REGRESSION.md E4 — inventory-service's own Postgres, a genuinely separate
  # instance (decision 1: a real second system, not a schema on the `postgres` container above).
  # Same ephemeral-per-run isolation model (no named/host volume, `node cli.mjs stop` runs
  # `down -v`).
  postgres-inventory:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${INV_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${INV_DB_PASSWORD:-postgres}
      POSTGRES_DB: ${INV_DB_NAME:-inventory_service}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${INV_DB_USER:-postgres}"]
      interval: 2s
      timeout: 3s
      retries: 20

  # PLAN_ENTERPRISE_REGRESSION.md E4 — warehouses/stock-levels/backorder-requests/restock-events,
  # called by apiV2's checkout over real HTTP (InventoryClientService); also hit directly by
  # tests/api/inventoryOps/ (env local's own `api inventory` named service, tflw.config). Depends
  # on `api` being healthy (not just started) because its seed script looks up apiV2's real seeded
  # product ids via `GET /v1/products` — apiV2 must not depend back on this service (that would be
  # a dependency cycle); `docker compose up --wait` still guarantees both are healthy before
  # `cli.mjs start` returns, well before any test or checkout call runs.
  inventory-service:
    build:
      context: ./inventory-service
    depends_on:
      postgres-inventory:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      INV_DB_HOST: postgres-inventory
      INV_DB_PORT: 5432
      INV_DB_USER: ${INV_DB_USER:-postgres}
      INV_DB_PASSWORD: ${INV_DB_PASSWORD:-postgres}
      INV_DB_NAME: ${INV_DB_NAME:-inventory_service}
      API_BASE_URL: http://api:4001/v1
      PORT: 4002
    ports:
      - "4002:4002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4002/v1/health"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apiV2
    depends_on:
      postgres:
        condition: service_healthy
    # M33 (plan_v2.md Part R Cluster C) — the container needs to dial back out to a throwaway
    # HTTP receiver bound on the host (started by tflw's JS escape hatch, `tests/helpers/
    # webhook-receiver.ts`), so `host.docker.internal` has to resolve from inside this container.
    # Docker Desktop provides this for free; the special `host-gateway` value is what makes it
    # resolve under plain Docker Engine on Linux too (20.10+).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-testflow_tests}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-5s}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-1h}
      JWT_SESSION_TTL: ${JWT_SESSION_TTL:-1h}
      JWT_SESSION_REFRESH_TTL: ${JWT_SESSION_REFRESH_TTL:-2h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PW: ${ADMIN_PW:-admin-pw-123}
      USER_A_EMAIL: ${USER_A_EMAIL:-alice@example.com}
      USER_A_PW: ${USER_A_PW:-alice-pw-123}
      USER_B_EMAIL: ${USER_B_EMAIL:-bob@example.com}
      USER_B_PW: ${USER_B_PW:-bob-pw-123}
      AGENT_A_EMAIL: ${AGENT_A_EMAIL:-carol@example.com}
      AGENT_A_PW: ${AGENT_A_PW:-carol-pw-123}
      AGENT_B_EMAIL: ${AGENT_B_EMAIL:-dave@example.com}
      AGENT_B_PW: ${AGENT_B_PW:-dave-pw-123}
      # perf-0 (PLAN_WEBV2_TARGETS.md §2) — dedicated identity for tflw load scenarios.
      LOAD_USER_EMAIL: ${LOAD_USER_EMAIL:-load@example.com}
      LOAD_USER_PW: ${LOAD_USER_PW:-load-pw-123}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-tflw-oauth-client}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-tflw-oauth-secret}
      OAUTH_ACCESS_TTL: ${OAUTH_ACCESS_TTL:-1h}
      OAUTH_SHORT_CLIENT_ID: ${OAUTH_SHORT_CLIENT_ID:-tflw-oauth-short-client}
      OAUTH_SHORT_CLIENT_SECRET: ${OAUTH_SHORT_CLIENT_SECRET:-tflw-oauth-short-secret}
      OAUTH_SHORT_ACCESS_TTL: ${OAUTH_SHORT_ACCESS_TTL:-5s}
      # PLAN_ENTERPRISE_REGRESSION.md E4 — checkout's real cross-service call
      # (InventoryClientService). Deliberately no `depends_on: inventory-service` here — that
      # service depends on `api` being healthy for its own seed step, so the reverse would be a
      # cycle; `docker compose up --wait` still guarantees both are healthy before any request
      # actually happens.
      INVENTORY_SERVICE_URL: ${INVENTORY_SERVICE_URL:-http://inventory-service:4002/v1}
      # testFlow M128a (PLAN_M128_PENTEST_TIER1.md D293) — the pentest arc's hygiene fixture slice
      # (apiV2/src/vuln/, VULNS.md). Passed through from the host, defaulting to off, so a bare
      # `node cli.mjs start` gives the ~45 other files the same clean app they have always had and
      # `VULN_MODE=1 node cli.mjs start` adds five deliberately-flawed-or-hardened responses.
      VULN_MODE: ${VULN_MODE:-}
      PORT: 4001
    ports:
      - "4001:4001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4001/v1/health"]
      interval: 2s
      timeout: 3s
      retries: 20

  # TLS sidecar (M22, enterprise arc cluster 1 — PLAN_ENTERPRISE.md decision 10): a self-signed
  # HTTPS listener (8443) and a client-cert-requiring listener (8444), both proxying to `api`
  # unchanged. Certs generated fresh at container start (nginx/docker-entrypoint.sh), written to
  # a host bind mount so a host-side `tflw run` can reference the CA/client cert directly.
  nginx:
    build:
      context: ./nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8443:8443"
      - "8444:8444"
    volumes:
      - ./nginx/certs:/certs
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://127.0.0.1:8443/v1/health"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Browser-arc dogfood target (webV2-0, PLAN_WEBV2_TARGETS.md): Vite+React+TS SPA storefront,
  # built and served by its own nginx (webV2/Dockerfile), which also reverse-proxies /v1/* to
  # `api` so the storefront and API share an origin (apiV2 sets no CORS headers and its session
  # cookie/CSRF pairing assumes same-origin). Deliberately its own nginx service, not the mTLS
  # sidecar above — that one is scoped to TLS/mTLS testing (M22) and serves nothing static.
  webv2:
    build:
      context: ./webV2
      # a11y flag corner (webV2-3): kept true so the dogfood stack always has the inaccessible
      # AccessibilityDemoPage half present for a future axe-core scan; flip to "false" here to
      # produce a build with that half genuinely absent (not just hidden) for the clean-only case.
      args:
        VITE_ENABLE_A11Y_VIOLATIONS: "true"
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8090:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 2s
      timeout: 3s
      retries: 20

  # SSR admin console (webV2-1, PLAN_WEBV2_TARGETS.md) — moderation/coupons/categories/tickets
  # over apiV2, deliberately full-page-navigation (plain Express+EJS, forms POST and redirect,
  # no client JS) rather than the storefront's async-re-render flake class above. Unlike webV2,
  # this one has no nginx in front and no /v1/* proxy: every apiV2 call happens server-to-server
  # (this container to `api`), so the browser only ever talks to this container and same-origin/
  # CORS never comes up.
  webv2-admin:
    build:
      context: ./webV2/admin
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8091:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/login"]
      interval: 2s
      timeout: 3s
      retries: 20
