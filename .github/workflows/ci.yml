name: CI

# PLAN_CI.md decision 1 said **post-merge signal only, no PR gate, no branch-protection changes**.
# Reversed 2026-08-07. Decision 1's premise was that a gate costs more than it is worth on a solo
# repo, and two things have since stopped being true of it:
#
#   - `main` here carried a `required_approving_review_count: 1` that GitHub structurally forbids a
#     solo owner from satisfying (no self-approval), so `main`'s only protection was a rule that
#     blocked every PR and verified nothing. Dropping it to 0 left the branch with no *verifying*
#     gate at all — a post-merge-only signal is a report, not a gate, and finds the breakage after
#     it is already on `main`.
#   - The signal has twice caught a real defect *after* the merge rather than before it — `M97e`
#     (a `TF043` false positive that made a valid suite unrunnable) and `M100` (`body pdf text` on
#     0.36% of payloads). Both were red on `main` before anyone knew, on a repo whose whole job is
#     to be the place tflw's breakage surfaces first.
#
# Decision 1's cost argument also does not survive the facts: this repo and `deepak-tuteja/tflw`
# are both **public**, so Actions minutes are free and unmetered. A full PR-head run is ~11 minutes
# wall-clock (measured on run 31196196601: apiv2 0:29, acceptance-check 0:27, the 4 regression legs
# 8:50-10:14 in parallel, merge-reports 0:11).
#
# This mirrors `../testFlow/.github/workflows/ci.yml`, which has always been `push: main` +
# `pull_request` with its jobs as required contexts.
on:
  push:
    branches: [main]
  pull_request:

# A PR head gets re-pushed (`update-branch` under `strict`, review fixups) more often than `main`
# does, and a superseded run's verdict is about a commit nobody will merge. Cancel those; never
# cancel a `push: main` run, whose result is the record for a commit that is already permanent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # decision 3 (unchanged) + Round 3 decision 16: split out of the old single job so this cheap,
  # fast-failing check doesn't get duplicated across every regression matrix leg below — it gates
  # the matrix via `needs:`, exactly like it used to gate the rest of the one job by running first.
  apiv2:
    runs-on: ubuntu-latest
    # `M143c` — every job here declares one. Measured max under a minute across 10 runs; this is
    # a hang bound, not a budget.
    timeout-minutes: 15
    steps:
      - name: Checkout testFlow-tests
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # `npm test` USED TO BE HERE and was deliberately removed (M141, D538). It was
      # `jest --passWithNoTests` over a tree with no test files — a gate green unconditionally
      # (`M138b-01`). The reason it is not being *fixed* instead is in CONTRIBUTING.md and is a
      # decision about what apiV2 is: a dogfood target, kept deliberately reshapeable so it can grow
      # whatever surface tflw needs next. Unit tests would pin the thing that is supposed to move.
      # Its assurance is the 30-phase `.tflw` sweep below, asserted from outside over HTTP.
      #
      # `--fix` came off `lint` in the same change: an autofixing linter's failure surface is only
      # the unfixable subset, so the job reported on a tree it had just silently rewritten.
      - name: apiV2 lint
        run: |
          npm ci
          npm run lint
        working-directory: apiV2

  # `tflw-acceptance/` is excluded from bare `tflw run` discovery on purpose (tflw.config's
  # `exclude`, D127) — it is a second suite with its own sessions, env and targets, and `npm test`
  # has no business starting it. The unnoticed consequence was that nothing *checked* it either, so
  # `TF033`'s two tightenings (M60, M89c) silently un-parsed 10 of the 12 `.tflw` files under
  # `tflw-acceptance/perf/` across four milestones, with nothing red anywhere. This job is the
  # missing signal. Its own job rather than a step inside `regression`, for two reasons: the sweep
  # is a 4-leg matrix and this would run four times, and this needs none of what those legs pay for
  # — no Docker stack, no Playwright, no `.env`. Parse + checker only, so it does not `needs:` the
  # apiV2 job and does not gate the matrix; a corpus that stopped parsing and a suite that failed
  # are independent facts and should be reported independently.
  acceptance-check:
    runs-on: ubuntu-latest
    # `M143c` — static checks, seconds. Same bound as `apiv2`, for the same reason.
    timeout-minutes: 15
    steps:
      - name: Checkout testFlow-tests
        uses: actions/checkout@v7
        with:
          path: testFlow-tests

      - name: Checkout tflw (testFlow)
        uses: actions/checkout@v7
        with:
          repository: deepak-tuteja/tflw
          path: testFlow

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install tflw workspace deps
        run: npm ci
        working-directory: testFlow

      - name: Refresh tflw from the checked-out build
        run: npm run refresh-tflw
        working-directory: testFlow-tests

      # Every directory under tflw-acceptance/ holding a tflw.config, discovered rather than listed
      # — see scripts/check-acceptance.mjs for why a hand-maintained list is the failure mode.
      - name: Check every acceptance corpus parses against current tflw
        run: npm run check:acceptance
        working-directory: testFlow-tests

      # Static, sends no request, and deliberately in the job that already walks every corpus. It
      # asserts the ruling on the one host this repo does not own — functional API tests only: no
      # load runs, no security scans, not on CI — and fails on any NEW external target that arrives
      # without a written reason. All three fences held before this existed, by omission rather
      # than by design.
      #
      # The target is named in scripts/verify-external-targets.mjs and deliberately NOT here: one of
      # the things that script checks is whether this file mentions it, so naming it in a comment
      # would be a hair away from tripping the guard on the step that runs it.
      - name: Every external target is declared and fenced
        run: npm run verify:external-targets
        working-directory: testFlow-tests

      # M154e (`B6-15`). Beside the step above because it is the same fence extended to the files
      # that step structurally cannot see: `verify-external-targets.mjs` discovers corpora by
      # walking for a `tflw.config`, so `perf/k6/`'s JavaScript and `perf/artillery/`'s YAML are not
      # overlooked but ineligible, and until now the host a load generator pointed at was asserted
      # by nothing at all. It also holds the three fixture values the ladder's three runners must
      # agree on — the drift that produced a 98% k6 failure rate at M48 and, on 2026-08-05, a 100%
      # error rate reported as PASS. Static, milliseconds, this repo only.
      - name: The perf ladder's runners agree, and every host is ours
        run: npm run verify:perf-parity
        working-directory: testFlow-tests

      # M138b (`M136a-02`). Static, seconds, and here for two reasons rather than one. The cheap
      # reason is that it is the same shape as the step above — no Docker, no .env, no Playwright.
      # The load-bearing one is that this is **the only job that checks out both repositories**, so
      # it is the one place in either repo where a claim about the sibling can be verified: tflw's
      # CONTRIBUTING.md points here for the cross-repo diagnostic-code pair, and this asserts the
      # pointer resolves.
      #
      # It does NOT skip when the sibling is missing. That is why the two PRs merge chained with
      # tflw first — between the two merges this repo's main is red, the same accepted window a new
      # TF0xx code opens.
      #
      # And note what this step is to itself: it is in the set it guards. Adding it meant
      # classifying it and naming it in CONTRIBUTING.md, which is the mechanism working on its
      # first day.
      - name: The gate set and CONTRIBUTING.md agree
        run: npm run verify:contributing
        working-directory: testFlow-tests

      # M141 (`M115-03`, `M128-04`). Static, seconds, and in THIS job for a reason that is not just
      # cheapness: half of what it asserts is that `released` and `branch` resolve to two DIFFERENT
      # programs, which is only true where both trees exist — and this is the only job that checks
      # out both. `refresh-tflw` above has already run `npm pack`, whose `prepack` builds the
      # sibling, so `packages/cli/dist/cli.cjs` is present by the time this runs.
      - name: One answer to "which tflw am I running?"
        run: npm run verify:tflw-resolution
        working-directory: testFlow-tests

      # M152e (`D673`, `D709`, `D711`). Static, seconds, and in this job for the same load-bearing
      # reason as the two above: it compares this repository's prose against tflw's published
      # DECISIONS.md **and** against tflw's tracked pin of this repository's citations, and only a
      # job with both trees can do either. Eight markdown links used to point at `../testFlow/…`,
      # which 404s for everyone whose disk does not happen to hold both checkouts side by side.
      - name: Prose links inside the repo, and citations that resolve
        run: npm run verify:provenance
        working-directory: testFlow-tests

      # M154b (`D723`, `D727`, `D730`, `D741`). Static — it reads one JSON document out of the
      # binary and compares some sets — and in THIS job for the load-bearing reason the three steps
      # above share: it is the only job that checks out both repositories, and this gate's ground
      # truth is `tflw spec --json` from the sibling's build. It also *refuses to run* unless the
      # vendored copy is current with that checkout, which only holds where both trees exist.
      #
      # `refresh-tflw` above is what makes it hold here on every run. That is also why CI could
      # never reproduce `M153b-01`: for CI the vendored build and the sibling are the same build by
      # construction, and the failure mode exists only where a human works.
      #
      # The plants themselves are NOT here — they need a stack, a browser and a load generator, and
      # they run as the `construct-acceptance` regression phase. This is the half that costs seconds
      # and answers the question that decayed: is every construct tflw ships accounted for at all.
      - name: Every construct tflw ships is rostered or explicitly unrostered
        run: npm run verify:construct-coverage
        working-directory: testFlow-tests

  # Round 3 decision 16 (PLAN_CI.md, 2026-08-03 grill-me): the 30-phase sweep used to run
  # sequentially in one job (~34min). Split into a 4-leg GH Actions job matrix — real per-phase
  # timings pulled from run 30802717073 (2026-08-03) were greedy-LPT bin-packed into
  # scripts/regression.mjs's PHASE_GROUPS, landing all 4 legs within ~8.0-8.7min of *sweep* time
  # each. Deliberately duplicates the cold checkout/npm ci/refresh-tflw/playwright-install cost
  # per leg (~2-3min) rather than engineering a shared build cache — each matrix leg is a fresh
  # runner VM, which also means free port/network/Postgres isolation between legs with zero
  # docker-compose project-namespacing work, the main reason "concurrent stacks on one runner"
  # was dropped from scope entirely (see decision 16's full writeup).
  regression:
    needs: apiv2
    runs-on: ubuntu-latest
    # `M143c` — measured across 37 successful legs: max 16m, mean 10.8m. 30 is ~1.9x that max,
    # the same ratio and the same number tflw gives its own heavy matrix. Before this milestone
    # NO job in this file had a timeout, so run 32270050039's stalled install was heading for
    # GitHub's 6-hour default; tflw's identical stall showed up in half an hour because its
    # shards were bounded. The same defect is quieter in the repo with less instrumentation.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # names, not numbers, so a failing/slow leg is identifiable from the job list alone —
        # see scripts/regression.mjs's PHASE_GROUPS for what each actually contains (duration-
        # bin-packed, not a strict semantic split).
        group: [core, tooling, safety, security-ui]
    steps:
      - name: Checkout testFlow-tests
        uses: actions/checkout@v7
        with:
          path: testFlow-tests

      # decision 2: no committed vendor tarball — every run dogfoods tflw's actual current `main`,
      # checked out fresh as a sibling repo, same as the local dev flow (scripts/refresh-tflw.mjs).
      - name: Checkout tflw (testFlow)
        uses: actions/checkout@v7
        with:
          repository: deepak-tuteja/tflw
          path: testFlow

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Needed before refresh-tflw.mjs packs packages/cli below — `npm pack`'s own `prepack`
      # lifecycle script rebuilds every workspace package cli depends on, which needs devDeps
      # installed across the whole tflw monorepo, not just packages/cli.
      - name: Install tflw workspace deps
        run: npm ci
        working-directory: testFlow

      # decision 10: no GitHub Secrets needed — docker-compose.yml already bakes a dev-safe
      # default into every credential it reads (`${ADMIN_EMAIL:-admin@example.com}` etc.). tflw
      # itself needs those same values in *its own* process env to authenticate against the
      # running stack — .env.example carries the identical defaults, so this is just the same
      # `cp .env.example .env` step README.md's own local Setup section documents.
      - name: Configure env (dev-safe defaults, matches docker-compose.yml's own fallbacks)
        run: cp .env.example .env
        working-directory: testFlow-tests

      # Packs testFlow/packages/cli into a tarball and `npm install`s it here — this is also
      # testFlow-tests' own dependency install (nothing else in package.json to install).
      - name: Refresh tflw from the checked-out build
        run: npm run refresh-tflw
        working-directory: testFlow-tests

      # `playwright` (this repo's own devDependency, just installed above) has no postinstall
      # browser-download hook — without this, every webV2 browser test (the `full suite` and
      # `--tag adminOps` phases discover tests/mixed/storefront.tflw) fails with "Executable
      # doesn't exist", confirmed on the first CI run after M7/webV2's suite actually landed on
      # main (run 30316658886; mirrors the same fix in tflw's own ci.yml). Chromium only — this
      # suite never exercises `--browser firefox`/`webkit`.
      #
      # M143c — no `--with-deps`, for the reason tflw's own `ci.yml` records in full at its build
      # job's copy of this step (`M143a`). Short version: `--with-deps` is an `apt-get install` of
      # 48.8 MB from azure.archive.ubuntu.com, measured at 58 kB/s on a bad runner, while the
      # browser archives it is confused with come from cdn.playwright.dev in about six seconds.
      # `ubuntu-latest` already carries Playwright's real dependency closure; what apt adds is CJK
      # fonts and media codecs, and nothing in this suite renders either.
      #
      # THIS REPO WAS MEASURED CAUGHT BY IT, not argued into the change. On run 32270050039 (PR #27)
      # the `tooling` and `security-ui` legs sat in THIS STEP for over three hours while `core` and
      # `safety` — same step, same run — finished in 11m and 14m. The stall is per-runner and
      # intermittent, which is why 8 samples of "0.4-0.7m, no stall" could not see it and Round 3
      # decision 16 priced this step at "~2-3min per leg" in good faith.
      #
      # If an engine ever does fail to launch, Playwright names the missing library on stderr:
      # install that one, by name, here. Never the closure again.
      - name: Install Playwright browsers
        run: npx playwright install chromium
        working-directory: testFlow-tests

      # decisions 5-8 + Round 3 decision 16: this matrix leg's slice of the 30 phases only
      # (`--group`, scripts/regression.mjs), each its own fresh Docker restart, archived per-phase
      # into report-by-phase/ as it goes. `--verbose` (and the resulting GitHub Actions
      # ::group::/::endgroup:: log grouping, tflw decision 111.8) is auto-detected from
      # GITHUB_ACTIONS — no extra flag needed here.
      #
      # `xvfb-run -a` (M42): the `watch-check` phase (group 2) spawns a real `tflw watch`, which
      # always forces a headed browser (`watchCommand`'s own `runOne` unconditionally appends
      # `--headed`, regardless of any flag `watch` itself is given — PLAN_WEBV2_M40.md decision 3's
      # claim that `watch` is headless-safe was wrong). Confirmed on the first CI run after M42
      # landed on main (run 30386703593): "Missing X server or $DISPLAY ... use 'xvfb-run
      # <your-playwright-app>'", the same failure and fix `testFlow`'s own ci.yml already applies
      # for its headed `watch.test.ts`. xvfb is preinstalled on the ubuntu-latest runner image, so
      # no extra apt-get install is needed. Kept on every leg rather than only group 2's, since
      # PHASE_GROUPS is repacked by hand over time and a future repack could move watch-check.
      - name: Regression sweep — group ${{ matrix.group }} (each phase its own fresh Docker restart)
        run: xvfb-run -a npm run regression -- --group ${{ matrix.group }}
        working-directory: testFlow-tests

      # Round 3 decision 16: each leg's report-by-phase/ uploaded under its own artifact name —
      # merged back into one before publishing, so the rest of CI (dorny/test-reporter, the final
      # `regression-reports` artifact) keeps behaving exactly like the old single-job sweep did.
      - name: Upload this leg's report-by-phase/
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-reports-group-${{ matrix.group }}
          path: testFlow-tests/report-by-phase/

  # Round 3 decision 16: recombines the 4 matrix legs' artifacts into the single
  # report-by-phase/ shape decisions 5-9 already relied on, so the JUnit publish step and the
  # final artifact name are unchanged from before this matrix existed — nothing downstream of
  # this job needed to learn groups exist.
  merge-reports:
    needs: regression
    if: always()
    runs-on: ubuntu-latest
    # `M143c` — downloads four artifacts and re-uploads one.
    timeout-minutes: 15
    steps:
      # dorny/test-reporter shells out to `git ls-files` internally — needs a real git repo at
      # `working-directory` below, same reason the old single job checked this out (see that
      # step's own history, preserved on the JUnit-publish step below). This job otherwise checks
      # out nothing, unlike `regression`, so this checkout exists purely for that.
      - name: Checkout testFlow-tests
        uses: actions/checkout@v7
        with:
          path: testFlow-tests

      - name: Download all groups' reports
        uses: actions/download-artifact@v7
        with:
          pattern: regression-reports-group-*
          path: testFlow-tests/report-by-phase
          merge-multiple: true

      # decision 9: surfaces pass/fail inline in the Actions run summary / PR checks, not just a
      # bare red X on the job.
      #
      # `demo-fail-check`'s own junit.xml is never named `junit.xml` on disk in the first place
      # (scripts/lib/regression-shared.mjs's archivePhaseReport() renames it to `junit-by-design.xml`)
      # — a plain `*/junit.xml` glob structurally can't pick it up. `watch-check` joined it in
      # `M143d`, for `M141`'s DISPLAY-less negative control; the phrase "exactly this phase" was
      # true when written and is not any more, which is why the count is no longer written here.
      # scripts/verify-demofail.mjs's real pass/fail verdict is its own count-based `check()` logic
      # (already gating the regression job above via its exit code), not the raw junit.xml that
      # phase happens to produce — that's just whichever `npx tflw run` call the script made *last*
      # (currently allow-hosts-blocked.tflw under `--env allowHostsBlocked`, one intentionally-
      # failing test by design). A first attempt at this (M35, commit 286a679) tried excluding it
      # via a comma-separated `!`-negation in this same `path` input instead — confirmed wrong on
      # the very next real run (30132116208): dorny/test-reporter's `LocalFileProvider` calls
      # fast-glob separately per comma-segment, so the negation segment glob'd on its own (matching
      # nothing) and never filtered the positive segment's results; the exclusion was a total
      # no-op. Renaming the file at the source, not filtering it at read time, is what actually
      # works — confirmed by construction, not by re-trusting an action's undocumented glob syntax.
      - name: Publish JUnit results inline
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: tflw regression
          working-directory: testFlow-tests
          path: 'report-by-phase/*/junit.xml'
          reporter: java-junit

      # decision 9: every phase's report.html/junit.xml/results.json (+ events.ndjson under
      # --format ndjson, unused here) uploaded — pass or fail, not failure-only — so a green run's
      # evidence stays inspectable too, not just a failing one's. Same artifact name as before the
      # matrix existed (`regression-reports`), now assembled from all 4 legs instead of one job.
      - name: Upload full report artifacts (every phase, merged)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-reports
          path: testFlow-tests/report-by-phase/
