# One grouped pull request a week for npm per lockfile (the repository root, `apiV2`,
# `inventory-service`, `webV2` and `webV2/admin` — five since tflw `M268b`, `D1454`, and
# `verify:lockfiles` fails when a committed lockfile has no entry here), one for GitHub Actions — merged by hand, and against the regression sweep,
# because a dependency of the application under test is part of what the corpus measures.
# Majors are left out of the groups (2026-09-27): a grouped PR carrying TypeScript 5.9 -> 7.0 or
# NestJS 11 -> 12 is a migration inside a bump, and one red major blocked every harmless minor
# beside it. A major arrives as its own pull request and is taken as its own piece of work.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /apiV2
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /inventory-service
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /webV2
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 1
  - package-ecosystem: npm
    directory: /webV2/admin
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 1
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']
    open-pull-requests-limit: 1
