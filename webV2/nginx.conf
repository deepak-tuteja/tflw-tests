worker_processes 1;
events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access: apiV2 sets no CORS headers, and its session-cookie/CSRF pairing
    # (apiV2/src/auth/auth.service.ts) assumes the storefront and API share an origin — so every
    # `/v1/*` request is proxied straight through rather than the SPA calling api:4001 directly.
    location /v1/ {
      proxy_pass http://api:4001/v1/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # SPA client-side routing: any non-file, non-/v1 path falls back to index.html so
    # react-router's history-mode routes (e.g. a reload on /products/:id) resolve correctly.
    location / {
      try_files $uri /index.html;
    }
  }
}
