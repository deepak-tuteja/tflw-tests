worker_processes 1;
events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access: apiV2 sets no CORS headers, and its session-cookie/CSRF pairing
    # (apiV2/src/auth/auth.service.ts) assumes the storefront and API share an origin — so every
    # `/v1/*` request is proxied straight through rather than the SPA calling api:4001 directly.
    location /v1/ {
      proxy_pass http://api:4001/v1/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
    }

    # `S-3a` (decision 16): the promo page is served under a strict Content-Security-Policy — this
    # origin's scripts, styles and images only, no framing — so a journey can prove an a11y scan
    # still works on a page that forbids injected scripts (tflw `M228-01`). Same SPA fallback.
    location = /promo {
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
      try_files /index.html =404;
    }

    # SPA client-side routing: any non-file, non-/v1 path falls back to index.html so
    # react-router's history-mode routes (e.g. a reload on /products/:id) resolve correctly.
    location / {
      try_files $uri /index.html;
    }
  }
}
